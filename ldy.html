<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어 독해 퀴즈</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#eef3f8;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#1e3a8a;
}

.info{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
    font-size:1.1rem;
    font-weight:bold;
}

.question-box{
    background:#f1f5ff;
    border-radius:15px;
    padding:25px;
    margin-bottom:20px;
}

.english{
    font-size:1.4rem;
    line-height:1.8;
    color:#111827;
}

.options{
    display:grid;
    gap:12px;
}

.option{
    border:none;
    padding:15px;
    border-radius:12px;
    text-align:left;
    cursor:pointer;
    background:#f8fafc;
    transition:0.2s;
    font-size:1rem;
}

.option:hover{
    background:#dbeafe;
}

.result{
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    display:none;
    line-height:1.8;
}

.correct{
    background:#dcfce7;
    color:#166534;
}

.wrong{
    background:#fee2e2;
    color:#991b1b;
}

.next-btn{
    margin-top:15px;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:1rem;
    cursor:pointer;
    display:none;
}

.game-over{
    display:none;
    text-align:center;
}

.game-over h2{
    color:#15803d;
    margin-bottom:15px;
}
</style>
</head>
<body>

<div class="container">

<h1>📘 영어 독해 퀴즈</h1>

<div class="info">
    <div>문제 <span id="questionNum">1</span>/10</div>
    <div>포인트 <span id="score">0</span></div>
</div>

<div id="quizArea">

    <div class="question-box">
        <div class="english" id="sentence"></div>
    </div>

    <div class="options" id="options"></div>

    <div class="result" id="result"></div>

    <button class="next-btn" id="nextBtn">다음 문제</button>

</div>

<div class="game-over" id="gameOver">
    <h2>🏆 게임 종료!</h2>
    <p>100포인트를 달성했습니다.</p>
    <h3>최종 점수 : <span id="finalScore"></span></h3>
    <br>
    <button class="next-btn" onclick="location.reload()" style="display:inline-block;">
        다시 시작
    </button>
</div>

</div>

<script>

hint:"Although는 '비록 ~이지만'이라는 의미입니다.",

"기술 혁신은 개인정보 보호를 강화하면서 생산성 향상 문제를 해결하였다.",
"기술 혁신은 생산성을 높였으며 개인정보 활용에 대한 우려를 대부분 해소하였다.",
"기술 혁신은 생산성보다 개인정보 보호를 우선하는 방향으로 발전하였다."
]
},

{

answer:"많은 연구자들은 국제 협력 없이는 기후 변화를 효과적으로 해결할 수 없다고 본다.",
hint:"without international cooperation에 주목해 보세요.",
reason:"국제 협력이 기후 변화 해결의 필수 조건임을 의미합니다.",
options:[
"많은 연구자들은 국제 협력 없이는 기후 변화를 효과적으로 해결할 수 없다고 본다.",
"많은 연구자들은 국제 협력이 기후 변화 문제를 더욱 복잡하게 만든다고 본다.",

hint:"more valuable than의 의미를 생각해 보세요.",
reason:"비판적 사고가 단순 암기보다 가치 있다고 말하고 있습니다.",
options:[

"교수는 충분한 암기가 비판적 사고보다 더 우선되어야 한다고 강조했다.",

{

hint:"not necessarily는 '반드시 그런 것은 아니다'입니다.",
reason:"생활 수준 향상과 불평등 감소는 별개의 문제라는 의미입니다.",

"경제 성장은 생활 수준보다 사회적 불평등 감소에 더 직접적인 영향을 준다."

{

hint:"tend to는 '~하는 경향이 있다'입니다.",
reason:"토론 참여와 학업 성과의 긍정적 관계를 설명합니다.",
options:[
"연구는 토론에 적극적으로 참여하는 학생들이 더 좋은 학업 성과를 보인다고 밝혔다.",
"연구는 토론 참여가 학업 성과와 거의 관련이 없다고 결론지었다.",
"연구는 토론보다 개별 학습이 성과 향상에 더 중요하다고 밝혔다.",
"연구는 토론 참여가 많을수록 학업 성과가 낮아질 수 있다고 밝혔다."
]
},

{
sentence:"Despite significant investments, the company failed to maintain its competitive advantage.",
answer:"그 회사는 많은 투자를 했지만 경쟁 우위를 유지하는 데 실패했다.",
hint:"Despite는 '~에도 불구하고'입니다.",
reason:"투자를 했음에도 원하는 결과를 얻지 못했다는 의미입니다.",
options:[
"그 회사는 많은 투자를 했지만 경쟁 우위를 유지하는 데 실패했다.",
"그 회사는 많은 투자 덕분에 경쟁 우위를 더욱 강화할 수 있었다.",
"그 회사는 경쟁 우위를 유지하기 위해 투자를 줄이는 전략을 선택했다.",
"그 회사는 투자보다 경쟁 우위 확보에 더 큰 관심을 두었다."
]
},

{
sentence:"Artificial intelligence is expected to transform various industries over the next decade.",
answer:"인공지능은 앞으로 10년 동안 다양한 산업을 크게 변화시킬 것으로 예상된다.",
hint:"is expected to는 '~할 것으로 예상된다'입니다.",
reason:"미래에 산업 전반에 변화가 일어날 것으로 전망합니다.",
options:[
"인공지능은 앞으로 10년 동안 다양한 산업을 크게 변화시킬 것으로 예상된다.",
"인공지능은 앞으로 10년 동안 일부 산업에서만 제한적으로 사용될 것이다.",
"인공지능은 산업 구조보다 교육 방식에 더 큰 영향을 줄 것으로 보인다.",
"인공지능은 이미 발전이 끝나 앞으로 큰 변화가 없을 것으로 예상된다."
]
},

{
sentence:"The author challenges the assumption that economic success always brings personal happiness.",
answer:"저자는 경제적 성공이 항상 행복을 가져온다는 생각에 의문을 제기한다.",

options:[

"저자는 경제적 성공이 행복의 가장 중요한 조건이라고 주장한다.",
"저자는 경제적 성공과 행복이 거의 동일한 개념이라고 설명한다.",
"저자는 행복보다 경제적 성공이 더 우선되어야 한다고 주장한다."
]

{
sentence:"Governments must balance economic development with environmental protection to ensure sustainable progress.",
answer:"정부는 지속 가능한 발전을 위해 경제 성장과 환경 보호의 균형을 맞춰야 한다.",
hint:"balance A with B를 떠올려 보세요.",
reason:"경제와 환경을 모두 고려해야 한다는 의미입니다.",
options:[
"정부는 지속 가능한 발전을 위해 경제 성장과 환경 보호의 균형을 맞춰야 한다.",
"정부는 지속 가능한 발전을 위해 경제 성장에만 집중해야 한다.",

]
},

{
sentence:"The evidence suggests that regular exercise can significantly improve mental well-being.",
answer:"증거에 따르면 규칙적인 운동은 정신적 건강을 크게 향상시킬 수 있다.",
hint:"suggests that은 '~임을 시사한다'입니다.",
reason:"운동과 정신 건강의 긍정적 관계를 설명합니다.",
options:[
"증거에 따르면 규칙적인 운동은 정신적 건강을 크게 향상시킬 수 있다.",
"증거에 따르면 규칙적인 운동은 정신 건강에 거의 영향을 미치지 않는다.",
"증거에 따르면 운동은 신체 건강보다 정신 건강에 부정적 영향을 준다.",
"증거에 따르면 정신 건강은 운동 여부와 관련이 없는 것으로 보인다."
]
}

];

let current = 0;
let score = 0;

const sentenceEl = document.getElementById("sentence");
const optionsEl = document.getElementById("options");
const resultEl = document.getElementById("result");
const nextBtn = document.getElementById("nextBtn");

function shuffle(array){
    return [...array].sort(()=>Math.random()-0.5);
}

function loadQuestion(){

    const q = questions[current];

    document.getElementById("questionNum").textContent = current + 1;

    sentenceEl.textContent = q.sentence;

    optionsEl.innerHTML = "";
    resultEl.style.display = "none";
    nextBtn.style.display = "none";

    shuffle(q.options).forEach(option=>{

        const btn = document.createElement("button");
        btn.className = "option";
        btn.textContent = option;

        btn.onclick = ()=>checkAnswer(option, btn);

        optionsEl.appendChild(btn);
    });
}

function checkAnswer(selected, button){

    const q = questions[current];

    if(selected === q.answer){

        document.querySelectorAll(".option").forEach(b=>{
            b.disabled = true;
        });

        score += 10;
        document.getElementById("score").textContent = score;

        resultEl.style.display = "block";
        resultEl.className = "result correct";

        resultEl.innerHTML = `
        <strong>✅ 정답!</strong><br>
        +10 포인트 획득<br><br>
        <strong>정답인 이유</strong><br>
        ${q.reason}
        `;

        nextBtn.style.display = "inline-block";

    }else{

        button.disabled = true;
        button.style.opacity = "0.5";

        resultEl.style.display = "block";
        resultEl.className = "result wrong";

        resultEl.innerHTML = `
        <strong>❌ 오답!</strong><br>
        다시 선택해보세요.<br><br>
        <strong>힌트</strong><br>
        ${q.hint}
        `;
    }
}

nextBtn.onclick = ()=>{

    if(score >= 100){
        finishGame();
        return;
    }

    current++;

    if(current >= questions.length){
        finishGame();
        return;
    }

    loadQuestion();
};

function finishGame(){

    document.getElementById("quizArea").style.display = "none";
    document.getElementById("gameOver").style.display = "block";
    document.getElementById("finalScore").textContent = score;
}

loadQuestion();

</script>

</body>
</html>
